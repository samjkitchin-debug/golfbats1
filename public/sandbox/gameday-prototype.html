<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDay Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ea;
      --surface: #fbf7ef;
      --ink: #1f1f1f;
      --muted: rgba(31,31,31,0.60);
      --accent: #d49a1b;
      --accent2: #e07a2f;
      --brandWordmarkGreen: #2e8f63;
      --stroke: 45 15% 85%;
      --glow: 45 70% 85% / 0.3;
      --pad: 20px;
      /* Legacy HSL support for backward compatibility */
      --text: 45 15% 12%;
      /* 3-tier prominence cascade */
      --scoreASize: 56px;
      --scoreAOpacity: 1;
      --scoreBSize: 24px;
      --scoreBOpacity: 0.4;
      --scoreCSize: 16px;
      --scoreCOpacity: 0.22;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
    }

    /* Logo Entry Flash */
    .logoSplash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .logoSplash img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: contain;
    }

    /* Mode Header */
    .mode-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      justify-content: space-between;
      padding: 8px var(--pad);
      border-bottom: 1px solid hsl(var(--stroke));
      font-size: 13px;
      background: var(--surface);
      backdrop-filter: blur(10px);
    }

    .mode-header-left {
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      text-align: left;
    }

    .mode-header-left.locked::before {
      content: '🔒';
      font-size: 12px;
    }

    .mode-header-right {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
    }


    /* Canvas */
    .canvas {
      position: relative;
      height: calc(100vh - 36px);
      padding: 0;
      background: var(--surface);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 40px hsl(var(--glow));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Control Deck (bottom third) */
    .controlDeck {
      position: relative;
      flex: 1;
      min-height: 33vh;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border-top: 1px solid hsl(var(--stroke));
      box-shadow: 0 -4px 20px hsl(var(--glow) / 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px var(--pad);
      touch-action: none;
      user-select: none;
      z-index: 5;
    }

    .controlDeck.locked {
      opacity: 0.6;
      pointer-events: none;
    }

    /* Primary CTA Button */
    .cta {
      position: absolute;
      bottom: 20px;
      right: var(--pad);
      min-height: 44px;
      padding: 12px 24px;
      background: hsl(var(--accent));
      color: hsl(0 0% 100%);
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 500;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: opacity 0.2s ease;
      z-index: 10;
      box-shadow: 0 2px 8px hsl(var(--glow) / 0.4);
    }

    .cta:hover {
      opacity: 0.9;
    }

    .cta:active {
      opacity: 0.8;
    }

    .cta:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* InPlay Panel - 2-Row Layout */
    .inPlayPanel {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 62% 38%;
      grid-template-rows: auto auto;
      gap: 16px;
    }

    /* BLUE - Leaderboards (top-left) */
    .leaderboardPanel {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Segmented toggle for Flight/Group */
    .segmentedToggle {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid hsl(var(--stroke));
      border-radius: 8px;
      width: fit-content;
    }

    .toggleOption {
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 500;
      color: hsl(var(--muted));
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggleOption.active {
      color: hsl(var(--text));
      background: hsl(var(--bg));
    }

    .leaderboardList {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .leaderboardRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      line-height: 1.4;
    }

    .leaderboardName {
      color: hsl(var(--text));
      font-weight: 500;
    }

    .leaderboardScore {
      color: hsl(var(--muted));
      font-weight: 500;
    }

    /* RED - Member Hero Score (right column, row 1) */
    .memberScorePanel {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 52px;
      gap: 12px;
    }

    .scoreBlock {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .memberHeroScore {
      font-size: 56px;
      font-weight: 500;
      color: hsl(var(--text));
      line-height: 1;
      text-align: center;
    }

    .memberHeroScore.score--default {
      color: hsl(var(--text));
    }

    .memberHeroScore.score--softGreen {
      color: #2f7d5a;
    }

    .memberHeroScore.score--strongGreen {
      color: #1f6f4a;
    }

    .memberHeroLabel {
      font-size: 13px;
      color: hsl(var(--muted));
      font-weight: 500;
      text-align: center;
    }

    .nameBlock {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .memberHeroName {
      font-size: 17px;
      color: hsl(var(--text));
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
    }

    /* YELLOW - Action Zone (full-width rail, row 2) */
    .actionZone {
      grid-column: 1 / 3;
      grid-row: 2;
      width: 100%;
      display: grid;
      align-items: center;
      padding: 16px var(--pad);
    }

    .actionZone.idle {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .actionZone.confirm {
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }

    .actionCta {
      grid-column: 1;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: opacity 0.2s ease;
      display: block;
      text-align: left;
    }

    .actionCta:hover {
      opacity: 0.7;
    }

    .actionBack {
      grid-column: 1;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: opacity 0.2s ease;
      display: block;
      text-align: left;
    }

    .actionBack:hover {
      opacity: 0.7;
    }

    .actionLock {
      grid-column: 3 / 5;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: opacity 0.2s ease;
      display: block;
      text-align: right;
    }

    .actionLock:hover {
      opacity: 0.7;
    }

    /* Scoring Matrix */
    .scoringMatrix {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scoreRow {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .playerName {
      min-width: 60px;
      font-size: 16px;
      font-weight: 500;
      color: hsl(var(--text));
      opacity: 1;
      transition: all 0.3s ease;
    }

    /* Inactive row: player name (Tier C - readable but muted) */
    .scoreRow.inactive .playerName {
      font-size: 15px;
      opacity: 0.4;
      color: hsl(var(--muted));
    }

    /* Score badge (next to player name) */
    .playerBadge {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      min-width: 24px;
      height: 20px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .badge.badgeDraft {
      background: var(--surface);
      border: 1px solid hsl(var(--stroke));
      color: hsl(var(--muted));
      opacity: 0.6;
    }

    .badge.badgeCommitted {
      background: hsl(var(--bg));
      border: 1px solid hsl(var(--stroke));
      color: hsl(var(--text));
      opacity: 0.8;
      position: relative;
    }

    .badge.badgeCommitted::after {
      content: '';
      position: absolute;
      right: 4px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: hsl(var(--accent));
      opacity: 0.6;
    }

    .scoreDial {
      flex: 1;
    }

    /* Edge Rails */
    .rail {
      position: fixed;
      top: 36px;
      bottom: 20px;
      width: 20px;
      background: linear-gradient(to right, hsl(var(--glow) / 0.1), transparent);
      pointer-events: auto;
      touch-action: pan-x;
      z-index: 10;
    }

    .rail.left {
      left: 0;
      background: linear-gradient(to right, hsl(var(--glow) / 0.1), transparent);
    }

    .rail.right {
      right: 0;
      background: linear-gradient(to left, hsl(var(--glow) / 0.1), transparent);
    }

    .rail--flash {
      animation: railFlash 120ms ease-out;
    }

    @keyframes railFlash {
      0% { background: linear-gradient(to right, hsl(var(--accent) / 0.3), transparent); }
      100% { background: linear-gradient(to right, hsl(var(--glow) / 0.1), transparent); }
    }

    .rail.right--flash {
      animation: railFlashRight 120ms ease-out;
    }

    @keyframes railFlashRight {
      0% { background: linear-gradient(to left, hsl(var(--accent) / 0.3), transparent); }
      100% { background: linear-gradient(to left, hsl(var(--glow) / 0.1), transparent); }
    }

    .divider {
      height: 1px;
      background: hsl(var(--stroke));
      margin: 12px 0;
    }

    /* Day Fore It Wordmark */
    .brandWordmark {
      text-align: center;
      padding: 16px calc(var(--pad) * 1.5);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.45em;
      color: var(--brandWordmarkGreen);
      text-transform: uppercase;
      user-select: none;
      pointer-events: none;
    }

    /* Top Instrument Canvas (2/3) */
    .instrumentTop {
      flex: 2;
      padding: var(--pad);
      padding-top: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* Hole Navigation */
    .holeNav {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      margin-bottom: 16px;
      font-size: 11px;
      color: hsl(var(--muted));
      opacity: 0.5;
    }

    .prevHole {
      text-align: left;
    }

    .nextHole {
      text-align: right;
    }

    .courseLabel {
      font-size: 15px;
      font-weight: 500;
      color: hsl(var(--muted));
      margin-bottom: 14px;
      text-align: left;
    }

    .hole-number {
      font-size: 128px;
      font-weight: 500;
      line-height: 1;
      color: hsl(var(--text));
      margin-bottom: 16px;
      text-align: left;
    }

    .instrument-row {
      font-size: 16px;
      color: hsl(var(--muted));
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .instrument-row-label {
      display: inline-block;
      min-width: 60px;
    }

    /* Score Dial */
    .scoreDial {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }

    .controlDeck.dragging .scoreDial .dialItem.isSelected {
      transform: scale(1.05);
    }

    .dialContainer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    /* Tier A: Active selected (most prominent) */
    .dialItem.isSelected {
      width: 70px;
      height: 70px;
      font-size: var(--scoreASize);
      font-weight: 500;
      color: hsl(var(--text));
      opacity: var(--scoreAOpacity);
      z-index: 2;
    }

    /* Tier B: Active unselected (muted + smaller) */
    .dialItem.isNeighbor {
      width: 50px;
      height: 50px;
      font-size: var(--scoreBSize);
      font-weight: 600;
      color: hsl(var(--muted));
      opacity: var(--scoreBOpacity);
      transition: all 0.3s ease;
      position: relative;
    }

    /* Base dialItem (for active row, non-selected) */
    .dialItem {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
    }

    /* Tier C: Inactive row score (smallest + most muted) - only used for inactive row single score display */
    .dialItem.isInactiveRow {
      font-size: var(--scoreCSize);
      font-weight: 600;
      color: hsl(var(--muted));
      opacity: var(--scoreCOpacity);
    }

    /* Shape decorators for selected value */
    .dialItem.isSelected.shapeCircle {
      border: 2px solid hsl(var(--accent2));
      border-radius: 999px;
    }

    .dialItem.isSelected.shapeSquare {
      border: 2px solid hsl(var(--muted));
      border-radius: 10px;
    }

    .dialItem.isSelected.shapeDoubleSquare {
      border: 2px solid hsl(var(--muted));
      border-radius: 10px;
      position: relative;
    }

    .dialItem.isSelected.shapeDoubleSquare::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid hsl(var(--muted) / 0.4);
      border-radius: 10px;
      transform: translate(4px, 4px);
      pointer-events: none;
    }


    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: hsl(var(--bg));
      border: 1px solid hsl(var(--stroke));
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      color: hsl(var(--text));
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 2px 8px hsl(var(--glow) / 0.5);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Logo Entry Flash -->
  <div id="logoSplash" class="logoSplash">
    <img src="/brand/logo-app.png" alt="Day Fore It" />
  </div>

  <!-- Mode Header -->
  <div class="mode-header">
    <div class="mode-header-left" id="modeHeaderLeft">Thru hole 7</div>
    <button class="mode-header-right">Exit GameDay</button>
  </div>

  <!-- Edge Rails -->
  <div class="rail left" id="leftRail"></div>
  <div class="rail right" id="rightRail"></div>

  <!-- Canvas -->
  <main class="canvas">
    <!-- Top Instrument Canvas (2/3) -->
    <div class="instrumentTop">
      <div class="holeNav">
        <span class="prevHole">← previous hole</span>
        <span class="nextHole">next hole →</span>
      </div>
      <div class="courseLabel">Tanah Merah</div>
      <div class="hole-number" id="holeNumber">7</div>
      <div class="instrument-row">
        <span class="instrument-row-label">Par</span>
        <span id="holePar">4</span>
      </div>
      <div class="instrument-row">
        <span class="instrument-row-label">Length</span>
        <span id="holeLength">434 m</span>
      </div>
      <div class="instrument-row">
        <span class="instrument-row-label">HCP</span>
        <span id="holeHcp">12</span>
      </div>
    </div>

    <!-- Day Fore It Wordmark -->
    <div class="brandWordmark">DAY FORE IT</div>

    <!-- Control Deck (bottom third) -->
    <div class="controlDeck" id="controlDeck">
      <!-- Content rendered by updateControlDeck() based on deckMode -->
      <button id="primaryCta" class="cta">Score this hole</button>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // Par array for holes 1-18
    const parByHole = [4, 5, 3, 4, 4, 5, 4, 3, 4, 4, 3, 5, 4, 4, 4, 3, 5, 4];
    // Length array for holes 1-18 (meters)
    const lengthByHole = [434, 520, 165, 398, 412, 540, 380, 155, 428, 410, 180, 525, 395, 405, 398, 170, 510, 420];
    // HCP array for holes 1-18
    const hcpByHole = [12, 2, 18, 10, 8, 4, 14, 16, 6, 8, 17, 1, 9, 7, 11, 15, 3, 5];
    
    // Group scoring state
    const playerNames = ['Sam', 'Alex', 'Jordan', 'Casey'];
    let activePlayerIndex = 0;
    
    // Per-hole score structure: scoreByHole[holeIndex][playerIndex] = { strokes: number | null, state: "unset" | "draft" | "committed" }
    const scoreByHole = Array.from({length: 18}, () =>
      Array.from({length: 4}, () => ({ strokes: null, state: "unset" }))
    );
    
    let currentHole = 7;
    let deckMode = "inPlay"; // "inPlay" | "scoring"
    let leaderboardMode = "group"; // "flight" | "group"
    let isLocked = false;
    let isPatchyReception = false;
    let syncTimeout = null;
    let longPressTimer = null;

    // Two-axis gesture state (pointer events)
    let deckDragStartX = 0;
    let deckDragStartY = 0;
    let deckStartPlayerIndex = 0;
    let deckStartStrokes = 0;
    let axisLock = null;
    let axisLockThreshold = 12;
    let isDeckDragging = false;
    
    // Gesture thresholds
    let dialThreshold = 34; // pixels per score step
    let playerThreshold = 48; // pixels per player step

    // Edge rail swipe state (pointer events)
    let railPointerId = null;
    let railStartX = 0;
    let railStartY = 0;
    let activeRail = null;

    // Get current cell for active player on current hole
    function getCurrentCell() {
      return scoreByHole[currentHole - 1][activePlayerIndex];
    }

    // Get current strokes for active player (with fallback to par if unset)
    function getCurrentStrokes() {
      const cell = getCurrentCell();
      if (cell.strokes !== null) {
        return cell.strokes;
      }
      // Use par as baseline if unset, but also register it as default score
      const par = parByHole[currentHole - 1];
      // Auto-register default score when accessed
      if (cell.strokes === null && deckMode === "scoring") {
        cell.strokes = par;
        cell.state = "draft";
      }
      return par;
    }

    // Set strokes for active player and mark as draft
    function setCurrentStrokes(value) {
      const cell = getCurrentCell();
      cell.strokes = Math.max(1, Math.min(12, value));
      // Set state to draft (unless already committed - allow edits but keep as draft until re-committed)
      if (cell.state !== "committed") {
        cell.state = "draft";
      } else {
        // If editing a committed score, change back to draft
        cell.state = "draft";
      }
    }

    // Commit current hole (convert all draft scores to committed)
    function commitCurrentHole() {
      const holeScores = scoreByHole[currentHole - 1];
      for (let i = 0; i < 4; i++) {
        const cell = holeScores[i];
        if (cell.state === "draft" && cell.strokes !== null) {
          cell.state = "committed";
        }
      }
    }

    // Commit and advance to next hole (shared function)
    function commitAndNextHole() {
      const previousHole = currentHole;
      commitCurrentHole();
      if (currentHole < 18) {
        currentHole++;
        deckMode = "inPlay"; // Return to inPlay mode after committing
        updateHoleDisplay();
        updateControlDeck();
        showToast(`Hole ${previousHole} saved`);
      }
    }

    // Update CTA button label and state (hidden in inPlay mode, shown in scoring mode)
    function updateCta() {
      const cta = document.getElementById('primaryCta');
      
      if (deckMode === "inPlay") {
        // Hide button in inPlay mode (action is handled by "Score hole →" link)
        cta.style.display = 'none';
      } else {
        // scoring mode - show button
        cta.style.display = 'block';
        const holeScores = scoreByHole[currentHole - 1];
        const allSet = holeScores.every(cell => cell.strokes !== null);
        
        if (allSet) {
          cta.textContent = 'Lock it in → Next hole';
        } else {
          cta.textContent = 'Sort this hole';
        }
      }
    }

    // Calculate net score for a player (simplified: sum of committed scores minus par total)
    function calculateNetScore(playerIdx) {
      let totalStrokes = 0;
      let totalPar = 0;
      for (let hole = 0; hole < 18; hole++) {
        const cell = scoreByHole[hole][playerIdx];
        if (cell.state === "committed" && cell.strokes !== null) {
          totalStrokes += cell.strokes;
          totalPar += parByHole[hole];
        }
      }
      const net = totalStrokes - totalPar;
      if (net === 0) return "E";
      return net > 0 ? `+${net}` : `${net}`;
    }

    // Placeholder leaderboard data
    const groupLeaderboard = [
      { name: "Alex", net: -1 },
      { name: "Sam", net: 0 },
      { name: "Jordan", net: 1 },
      { name: "Casey", net: 3 }
    ];

    const flightLeaderboard = [
      { name: "Alex", net: -2 },
      { name: "Sam", net: 0 },
      { name: "Jordan", net: 1 },
      { name: "Casey", net: 2 }
    ];

    // Render leaderboard list
    function renderLeaderboardList(mode) {
      const data = mode === "flight" ? flightLeaderboard : groupLeaderboard;
      const list = document.createElement('div');
      list.className = 'leaderboardList';
      
      for (const item of data) {
        const row = document.createElement('div');
        row.className = 'leaderboardRow';
        
        const name = document.createElement('span');
        name.className = 'leaderboardName';
        name.textContent = item.name;
        
        const score = document.createElement('span');
        score.className = 'leaderboardScore';
        const netText = item.net === 0 ? "E" : (item.net > 0 ? `+${item.net}` : `${item.net}`);
        score.textContent = netText;
        
        row.appendChild(name);
        row.appendChild(score);
        list.appendChild(row);
      }
      
      return list;
    }

    // Render InPlayPanel - 3-Zone Instrument Deck
    function renderInPlayPanel() {
      const inPlayPanel = document.createElement('div');
      inPlayPanel.id = 'inPlayPanel';
      inPlayPanel.className = 'inPlayPanel';
      
      // BLUE - Leaderboards (top-left)
      const leaderboardPanel = document.createElement('div');
      leaderboardPanel.className = 'leaderboardPanel';
      
      // Segmented toggle
      const toggle = document.createElement('div');
      toggle.className = 'segmentedToggle';
      
      const flightOption = document.createElement('button');
      flightOption.className = `toggleOption ${leaderboardMode === "flight" ? "active" : ""}`;
      flightOption.textContent = 'Flight';
      flightOption.addEventListener('click', () => {
        leaderboardMode = "flight";
        updateControlDeck();
      });
      
      const groupOption = document.createElement('button');
      groupOption.className = `toggleOption ${leaderboardMode === "group" ? "active" : ""}`;
      groupOption.textContent = 'Group';
      groupOption.addEventListener('click', () => {
        leaderboardMode = "group";
        updateControlDeck();
      });
      
      toggle.appendChild(flightOption);
      toggle.appendChild(groupOption);
      leaderboardPanel.appendChild(toggle);
      
      // Leaderboard list
      const list = renderLeaderboardList(leaderboardMode);
      leaderboardPanel.appendChild(list);
      inPlayPanel.appendChild(leaderboardPanel);
      
      // RED - Member Hero Score (right column, full height)
      const memberScorePanel = document.createElement('div');
      memberScorePanel.className = 'memberScorePanel';
      
      // Score block (E) - positioned near top
      const scoreBlock = document.createElement('div');
      scoreBlock.className = 'scoreBlock';
      
      // Calculate nett score value for color logic
      let totalStrokes = 0;
      let totalPar = 0;
      for (let hole = 0; hole < 18; hole++) {
        const cell = scoreByHole[hole][0]; // Sam is index 0
        if (cell.state === "committed" && cell.strokes !== null) {
          totalStrokes += cell.strokes;
          totalPar += parByHole[hole];
        }
      }
      const nettValue = totalStrokes - totalPar;
      
      const heroScore = document.createElement('div');
      heroScore.className = 'memberHeroScore';
      const scoreText = calculateNetScore(0); // Sam is index 0
      heroScore.textContent = scoreText;
      
      // Apply semantic color based on nett value
      if (nettValue <= -3) {
        heroScore.classList.add('score--strongGreen');
      } else if (nettValue <= -1) {
        heroScore.classList.add('score--softGreen');
      } else {
        heroScore.classList.add('score--default');
      }
      
      scoreBlock.appendChild(heroScore);
      
      memberScorePanel.appendChild(scoreBlock);
      
      // Name block (Sam) - positioned where it currently is
      const nameBlock = document.createElement('div');
      nameBlock.className = 'nameBlock';
      
      const heroName = document.createElement('div');
      heroName.className = 'memberHeroName';
      heroName.textContent = 'Your score';
      nameBlock.appendChild(heroName);
      
      memberScorePanel.appendChild(nameBlock);
      
      inPlayPanel.appendChild(memberScorePanel);
      
      // YELLOW - Action Zone (idle mode only: "Score hole →")
      const actionZone = document.createElement('div');
      actionZone.className = 'actionZone idle';
      
      const actionCta = document.createElement('div');
      actionCta.className = 'actionCta';
      actionCta.textContent = 'Score hole →';
      actionCta.addEventListener('click', () => {
        deckMode = "scoring";
        updateControlDeck();
      });
      actionZone.appendChild(actionCta);
      
      inPlayPanel.appendChild(actionZone);
      
      return inPlayPanel;
    }

    // Render ScoringPanel (matrix + action rail)
    function renderScoringPanel() {
      const wrapper = document.createElement('div');
      wrapper.id = 'scoringPanel';
      wrapper.style.display = 'flex';
      wrapper.style.flexDirection = 'column';
      wrapper.style.width = '100%';
      wrapper.style.height = '100%';
      
      const matrix = document.createElement('div');
      matrix.id = 'scoringMatrix';
      matrix.className = 'scoringMatrix';
      
      const par = parByHole[currentHole - 1];
      const visibleRange = 2;
      
      for (let playerIdx = 0; playerIdx < 4; playerIdx++) {
        const isActive = playerIdx === activePlayerIndex;
        const row = document.createElement('div');
        row.className = `scoreRow ${isActive ? 'active' : 'inactive'}`;
        
        // Player name container (with badge)
        const nameContainer = document.createElement('div');
        nameContainer.style.display = 'flex';
        nameContainer.style.alignItems = 'center';
        
        const nameEl = document.createElement('div');
        nameEl.className = 'playerName';
        nameEl.textContent = playerNames[playerIdx];
        nameContainer.appendChild(nameEl);
        
        // Score badge (only if state != "unset")
        const cell = scoreByHole[currentHole - 1][playerIdx];
        if (cell.state !== "unset" && cell.strokes !== null) {
          const badgeEl = document.createElement('div');
          badgeEl.className = `playerBadge badge ${cell.state === "draft" ? "badgeDraft" : "badgeCommitted"}`;
          badgeEl.textContent = cell.strokes;
          nameContainer.appendChild(badgeEl);
        }
        
        row.appendChild(nameContainer);
        
        if (isActive) {
          // Active row: full score dial
          const strokes = getCurrentStrokes();
          
          // Calculate range centered on strokes
          let minValue = strokes - visibleRange;
          let maxValue = strokes + visibleRange;
          
          // Clamp to valid range (1-12)
          if (minValue < 1) {
            maxValue = Math.min(12, maxValue + (1 - minValue));
            minValue = 1;
          }
          if (maxValue > 12) {
            minValue = Math.max(1, minValue - (maxValue - 12));
            maxValue = 12;
          }
          
          const dialContainer = document.createElement('div');
          dialContainer.className = 'dialContainer';
          
          for (let i = minValue; i <= maxValue; i++) {
            const item = document.createElement('div');
            const isSelected = i === strokes;
            
            if (isSelected) {
              item.className = 'dialItem isSelected';
              // Add shape decorator based on relation to par (Tier A only)
              const diff = strokes - par;
              if (diff <= -1) {
                item.classList.add('shapeCircle');
              } else if (diff === 1) {
                item.classList.add('shapeSquare');
              } else if (diff === 2) {
                item.classList.add('shapeDoubleSquare');
              }
            } else {
              item.className = 'dialItem isNeighbor'; // Tier B
            }
            
            item.textContent = i;
            dialContainer.appendChild(item);
          }
          
          const scoreDial = document.createElement('div');
          scoreDial.className = 'scoreDial';
          scoreDial.appendChild(dialContainer);
          row.appendChild(scoreDial);
        } else {
          // Inactive row: player name only (no score numbers)
          // No additional content added here
        }
        
        matrix.appendChild(row);
      }
      
      wrapper.appendChild(matrix);
      
      // YELLOW - Action Zone (confirm mode: "← Back" and "Lock in and go to next hole →")
      const actionZone = document.createElement('div');
      actionZone.className = 'actionZone confirm';
      
      const actionBack = document.createElement('div');
      actionBack.className = 'actionBack';
      actionBack.textContent = '← Back';
      actionBack.addEventListener('click', () => {
        deckMode = "inPlay";
        updateControlDeck();
      });
      actionZone.appendChild(actionBack);
      
      const actionLock = document.createElement('div');
      actionLock.className = 'actionLock';
      actionLock.textContent = 'Lock in and go to next hole →';
      actionLock.addEventListener('click', () => {
        commitAndNextHole();
        deckMode = "inPlay";
        updateControlDeck();
      });
      actionZone.appendChild(actionLock);
      
      wrapper.appendChild(actionZone);
      
      return wrapper;
    }

    // Render control deck content based on deckMode
    function renderControlDeck() {
      const controlDeck = document.getElementById('controlDeck');
      
      // Remove existing panels
      const existingMatrix = controlDeck.querySelector('#scoringMatrix');
      const existingInPlay = controlDeck.querySelector('#inPlayPanel');
      const existingScoringPanel = controlDeck.querySelector('#scoringPanel');
      if (existingMatrix) existingMatrix.remove();
      if (existingInPlay) existingInPlay.remove();
      if (existingScoringPanel) existingScoringPanel.remove();
      
      // Render based on mode
      let panel;
      if (deckMode === "inPlay") {
        panel = renderInPlayPanel();
      } else {
        panel = renderScoringPanel();
      }
      
      // Insert panel before button (button is last child)
      const button = controlDeck.querySelector('#primaryCta');
      if (button) {
        controlDeck.insertBefore(panel, button);
      } else {
        controlDeck.appendChild(panel);
      }
      
      updateCta();
    }

    // Update control deck content (InPlayPanel vs ScoringPanel)
    function updateControlDeck() {
      renderControlDeck();
    }

    // Initialize
    function updateHoleDisplay() {
      const holeIndex = currentHole - 1;
      document.getElementById('holeNumber').textContent = currentHole;
      document.getElementById('holePar').textContent = parByHole[holeIndex];
      document.getElementById('holeLength').textContent = `${lengthByHole[holeIndex]} m`;
      document.getElementById('holeHcp').textContent = hcpByHole[holeIndex];
      // Update header left with current hole
      document.getElementById('modeHeaderLeft').textContent = `Thru hole ${currentHole}`;
      // Update control deck (handles both modes)
      updateControlDeck();
    }

    // Legacy function name for compatibility - now just re-renders control deck
    function updateScoringMatrix() {
      if (deckMode === "scoring") {
        renderControlDeck();
      }
    }

    // Legacy function name for compatibility
    function updateScoreDial() {
      if (deckMode === "scoring") {
        renderControlDeck();
      }
    }

    function updateStrokes() {
      updateScoreDial();
      updateCta();
      if (!isLocked) {
        handleSave();
      }
    }

    function handleSave() {
      // Keep underlying save/sync logic intact (no user-facing UI)
      if (syncTimeout) {
        clearTimeout(syncTimeout);
      }
      // No status pill updates - logic runs silently
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function flashRail(rail) {
      if (rail.id === 'leftRail') {
        rail.classList.add('rail--flash');
        setTimeout(() => rail.classList.remove('rail--flash'), 120);
      } else {
        rail.classList.add('right--flash');
        setTimeout(() => rail.classList.remove('right--flash'), 120);
      }
    }

    // Locked state toggle (dev-only: long-press on header left)
    const modeHeaderLeft = document.getElementById('modeHeaderLeft');
    modeHeaderLeft.addEventListener('pointerdown', (e) => {
      longPressTimer = setTimeout(() => {
        isLocked = !isLocked;
        modeHeaderLeft.classList.toggle('locked', isLocked);
        // Preserve "Thru hole X" text; lock icon shown via CSS ::before
        const controlDeck = document.getElementById('controlDeck');
        controlDeck.classList.toggle('locked', isLocked);
        handleSave();
      }, 600);
    });

    modeHeaderLeft.addEventListener('pointerup', () => {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    });

    modeHeaderLeft.addEventListener('pointercancel', () => {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    });


    // Two-axis gestures on control deck (pointer events)
    const controlDeck = document.getElementById('controlDeck');

    controlDeck.addEventListener('pointerdown', (e) => {
      if (isLocked || deckMode !== "scoring") return;
      controlDeck.setPointerCapture(e.pointerId);
      isDeckDragging = true;
      deckDragStartX = e.clientX;
      deckDragStartY = e.clientY;
      deckStartPlayerIndex = activePlayerIndex;
      deckStartStrokes = getCurrentStrokes();
      axisLock = null;
      controlDeck.classList.add('dragging');
      e.preventDefault();
    });

    controlDeck.addEventListener('pointermove', (e) => {
      if (!isDeckDragging || isLocked) return;
      
      const deltaX = e.clientX - deckDragStartX;
      const deltaY = e.clientY - deckDragStartY;
      
      // Determine axis lock once movement exceeds threshold
      if (axisLock === null) {
        if (Math.abs(deltaX) > axisLockThreshold || Math.abs(deltaY) > axisLockThreshold) {
          axisLock = Math.abs(deltaX) > Math.abs(deltaY) ? 'x' : 'y';
        }
      }
      
      if (axisLock === 'x') {
        // Horizontal: adjust strokes
        const step = Math.floor(deltaX / dialThreshold);
        const newStrokes = Math.max(1, Math.min(12, deckStartStrokes - step));
        
        if (newStrokes !== getCurrentStrokes()) {
          setCurrentStrokes(newStrokes);
          updateStrokes();
        }
      } else if (axisLock === 'y') {
        // Vertical: switch player (clamp, no wraparound)
        const playerStep = Math.floor(-deltaY / playerThreshold);
        const candidateIndex = deckStartPlayerIndex + playerStep;
        const newIndex = Math.max(0, Math.min(playerNames.length - 1, candidateIndex));
        
        if (newIndex !== activePlayerIndex) {
          activePlayerIndex = newIndex;
          // Ensure default score is registered when switching to player
          if (deckMode === "scoring") {
            getCurrentStrokes(); // This will auto-set par if null
          }
          updateControlDeck(); // Update matrix to show new active player
        }
      }
      
      e.preventDefault();
    });

    controlDeck.addEventListener('pointerup', (e) => {
      if (isDeckDragging) {
        const strokesChanged = getCurrentStrokes() !== deckStartStrokes;
        isDeckDragging = false;
        controlDeck.releasePointerCapture(e.pointerId);
        controlDeck.classList.remove('dragging');
        axisLock = null;
        
        // Only trigger save/sync if strokes changed (not just player switch)
        if (strokesChanged && !isLocked) {
          handleSave();
        }
      }
    });

    controlDeck.addEventListener('pointercancel', (e) => {
      if (isDeckDragging) {
        isDeckDragging = false;
        controlDeck.releasePointerCapture(e.pointerId);
        controlDeck.classList.remove('dragging');
        axisLock = null;
      }
    });

    // Edge rail gestures (pointer events)
    const leftRail = document.getElementById('leftRail');
    const rightRail = document.getElementById('rightRail');

    function handleRailPointerDown(e, rail) {
      rail.setPointerCapture(e.pointerId);
      railPointerId = e.pointerId;
      railStartX = e.clientX;
      railStartY = e.clientY;
      activeRail = rail;
      e.preventDefault();
    }

    function handleRailPointerMove(e) {
      if (railPointerId === null || activeRail === null) return;
      if (e.pointerId !== railPointerId) return;
      e.preventDefault();
    }

    function handleRailPointerUp(e) {
      if (railPointerId === null || activeRail === null) return;
      if (e.pointerId !== railPointerId) return;

      const deltaX = e.clientX - railStartX;
      const deltaY = Math.abs(e.clientY - railStartY);

      // Left rail: swipe right (deltaX >= +52px) to go previous
      if (activeRail === leftRail && deltaX >= 52 && deltaY <= 28) {
        if (currentHole > 1) {
          currentHole--;
          updateHoleDisplay();
          flashRail(leftRail);
        }
      }
      // Right rail: swipe left (deltaX <= -52px) to commit & next hole
      else if (activeRail === rightRail && deltaX <= -52 && deltaY <= 28) {
        flashRail(rightRail);
        commitAndNextHole();
      }

      activeRail.releasePointerCapture(e.pointerId);
      railPointerId = null;
      activeRail = null;
      e.preventDefault();
    }

    function handleRailPointerCancel(e) {
      if (railPointerId === null || activeRail === null) return;
      if (e.pointerId !== railPointerId) return;

      if (activeRail) {
        activeRail.releasePointerCapture(e.pointerId);
      }
      railPointerId = null;
      activeRail = null;
    }

    leftRail.addEventListener('pointerdown', (e) => handleRailPointerDown(e, leftRail));
    rightRail.addEventListener('pointerdown', (e) => handleRailPointerDown(e, rightRail));
    leftRail.addEventListener('pointermove', handleRailPointerMove);
    rightRail.addEventListener('pointermove', handleRailPointerMove);
    leftRail.addEventListener('pointerup', handleRailPointerUp);
    rightRail.addEventListener('pointerup', handleRailPointerUp);
    leftRail.addEventListener('pointercancel', handleRailPointerCancel);
    rightRail.addEventListener('pointercancel', handleRailPointerCancel);

    // Primary CTA button click handler
    const primaryCta = document.getElementById('primaryCta');
    primaryCta.addEventListener('click', () => {
      if (deckMode === "inPlay") {
        // Switch to scoring mode
        deckMode = "scoring";
        updateControlDeck();
      } else {
        // scoring mode
        const holeScores = scoreByHole[currentHole - 1];
        const allSet = holeScores.every(cell => cell.strokes !== null);
        
        if (allSet) {
          // Complete: commit and advance
          commitAndNextHole();
        } else {
          // Incomplete: jump to first missing player
          const idx = holeScores.findIndex(cell => cell.strokes === null);
          if (idx >= 0) {
            activePlayerIndex = idx;
            // Ensure default score is registered when switching to player
            getCurrentStrokes(); // This will auto-set par if null
            updateControlDeck();
          } else {
            // Rare edge case: show toast
            showToast('Missing score');
          }
        }
      }
    });

    // Logo entry flash fade in/out
    const logoSplash = document.getElementById('logoSplash');
    if (logoSplash) {
      // Fade in immediately on next frame
      requestAnimationFrame(() => {
        logoSplash.style.opacity = '1';
        
        // Fade out after 350-450ms
        setTimeout(() => {
          logoSplash.style.transition = 'opacity 180ms ease-out';
          logoSplash.style.opacity = '0';
          
          // Hide after fade out
          setTimeout(() => {
            logoSplash.style.display = 'none';
          }, 180);
        }, 400);
      });
    }

    // Initialize display
    updateHoleDisplay();
  </script>
</body>
</html>
